name: Release

# Fires when git-manager pushes a vX.Y.Z tag (see .claude/agents/git-manager.md).
# Builds the installer on each OS and attaches them to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            release/*/*.exe
            release/*/*.exe.blockmap
            release/*/*.dmg
            release/*/*.dmg.blockmap
            release/*/*.AppImage
            release/*/*.yml
